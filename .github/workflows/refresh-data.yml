name: Refresh mission data

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install
        run: uv sync --locked
      - name: Rebuild the mission catalogue
        run: uv run python scripts/build_catalogue.py
      - name: Refuse anything that lost missions
        run: uv run python scripts/check_catalogue.py
      - name: Test against the new data
        run: uv run pytest -q
      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/catalogue.json; then
            echo "Mission data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          git commit -m "Refresh mission data"
          git push
          # A push made with this token starts no workflows, so ask for the deploy.
          gh workflow run pages.yml --ref main
